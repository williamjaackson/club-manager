name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: club-manager-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            trap 'rm -f /tmp/deploy_key' EXIT
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i /tmp/deploy_key root@${{ secrets.VPS_HOST }} '
              cd /opt/club-manager
              git fetch origin main
              git switch main
              git pull --ff-only origin main
              docker compose up --build --force-recreate --remove-orphans --wait --wait-timeout 120 bot
            '
